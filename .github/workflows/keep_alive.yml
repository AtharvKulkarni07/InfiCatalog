name: Render Backend Keep-Alive Ping

on:
  schedule:
    # Run every 12 minutes (Render spins down after 15 mins of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive health ping
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://inficatalog-api.onrender.com' }}
        run: |
          echo "Pinging $BACKEND_URL/api/health/ ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health/" || true)
          echo "Response HTTP Status: $STATUS"
