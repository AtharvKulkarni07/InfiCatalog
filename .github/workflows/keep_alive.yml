name: Keep Backend Alive

on:
  schedule:
    # Render free-tier instances spin down after 15 minutes of inactivity.
    # Ping every 14 minutes to keep the container continuously warm and responsive.
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive-ping:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive health check to Render backend
        run: |
          echo "==> [$(date -u)] Sending keep-alive ping to InfiCatalog backend..."
          RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" \
            --connect-timeout 60 \
            --max-time 90 \
            "https://inficatalog-api.onrender.com/api/health/")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" = "200" ]; then
            echo "==> [SUCCESS] Backend is warm and healthy (HTTP 200)."
          else
            echo "==> [NOTICE] Backend responded with status $STATUS (may be waking up)."
          fi
